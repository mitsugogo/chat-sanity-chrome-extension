name: Release Extension

on:
  release:
    types:
      - published

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Release Chrome Extension

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare WXT types
        run: pnpm wxt prepare

      - name: Sync package version with release tag
        shell: bash
        run: |
          set -euo pipefail

          TAG_NAME="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG_NAME#v}"

          echo "Git tag:               ${TAG_NAME}"
          echo "Git tag version:       ${TAG_VERSION}"

          if ! [[ "${TAG_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must use the vMAJOR.MINOR.PATCH format. Received: ${TAG_NAME}"
            exit 1
          fi

          pnpm version "${TAG_VERSION}" --no-git-tag-version --allow-same-version

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "${PACKAGE_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::Failed to set package.json version to ${TAG_VERSION}"
            exit 1
          fi

      - name: Check formatting
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build extension ZIP
        run: pnpm zip

      - name: Resolve ZIP path
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIP_FILES < <(
            find .output -maxdepth 1 -type f -name '*.zip' -print
          )

          if [ "${#ZIP_FILES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one extension ZIP, found ${#ZIP_FILES[@]}"
            printf '%s\n' "${ZIP_FILES[@]}"
            exit 1
          fi

          ZIP_PATH="${ZIP_FILES[0]}"

          echo "path=${ZIP_PATH}" >> "${GITHUB_OUTPUT}"
          echo "name=$(basename "${ZIP_PATH}")" >> "${GITHUB_OUTPUT}"

          echo "Release asset:"
          ls -lh "${ZIP_PATH}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chat-sanity-${{ github.event.release.tag_name }}
          path: ${{ steps.zip.outputs.path }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Attach ZIP to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh release upload "${{ github.event.release.tag_name }}" \
            "${{ steps.zip.outputs.path }}" \
            --clobber
