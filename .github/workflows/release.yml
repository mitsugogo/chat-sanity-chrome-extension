name: Release Extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release Chrome Extension

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare WXT types
        run: pnpm wxt prepare

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          echo "package.json version: ${PACKAGE_VERSION}"
          echo "Git tag version:       ${TAG_VERSION}"

          if [ "${PACKAGE_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::Git tag v${TAG_VERSION} does not match package.json version ${PACKAGE_VERSION}"
            exit 1
          fi

      - name: Check formatting
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build extension ZIP
        run: pnpm zip

      - name: Resolve ZIP path
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIP_FILES < <(
            find .output -maxdepth 1 -type f -name '*.zip' -print
          )

          if [ "${#ZIP_FILES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one extension ZIP, found ${#ZIP_FILES[@]}"
            printf '%s\n' "${ZIP_FILES[@]}"
            exit 1
          fi

          ZIP_PATH="${ZIP_FILES[0]}"

          echo "path=${ZIP_PATH}" >> "${GITHUB_OUTPUT}"
          echo "name=$(basename "${ZIP_PATH}")" >> "${GITHUB_OUTPUT}"

          echo "Release asset:"
          ls -lh "${ZIP_PATH}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chat-sanity-${{ github.ref_name }}
          path: ${{ steps.zip.outputs.path }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "${GITHUB_REF_NAME}" \
            "${{ steps.zip.outputs.path }}" \
            --verify-tag \
            --title "ChatSanity ${GITHUB_REF_NAME}" \
            --generate-notes
